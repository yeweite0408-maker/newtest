server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/game_mall;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  sql:
    init:
      mode: always
      continue-on-error: true
  web:
    resources:
      static-locations: classpath:/static/,file:./uploads/

mybatis:
  type-aliases-package: com.mall.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: GameMallSecretKey2024ForJWTTokenGenerationAndValidation!
  expiration: 86400000

upload:
  path: ./uploads/
